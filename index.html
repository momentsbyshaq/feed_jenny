<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Feed Jenny! 🎂</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at top, #c0185a 0%, #8b0f3e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      padding: 44px 20px 60px;
    }
    .title {
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 20px;
      line-height: 1.3;
    }
    .jenny-container {
      position: relative;
      width: 300px;
    }
    .jenny-body {
      width: 100%;
      display: block;
    }
    .jenny-eyes, .jenny-mouth {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      pointer-events: none;
    }
    .jenny-eyes  { z-index: 2; }
    .jenny-mouth { z-index: 3; }
    .feed-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 52%;
      z-index: 10;
      background: #f4b8c8;
      color: #8b0f3e;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: none;
      border-radius: 50px;
      padding: 13px 48px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      white-space: nowrap;
      transition: transform 0.1s, background 0.1s;
    }
    .feed-btn:active { transform: translateX(-50%) scale(0.93); background: #f0a0b8; }
    .counter {
      color: rgba(255,255,255,0.8);
      font-size: 15px;
      font-weight: 500;
      margin-top: 16px;
      letter-spacing: 0.06em;
    }
    .food-float {
      position: fixed; font-size: 44px; pointer-events: none;
      animation: floatUp 1.5s ease-out forwards; z-index: 100;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(0.8); }
      20%  { opacity: 1; transform: translateY(-20px) scale(1.25); }
      80%  { opacity: 1; transform: translateY(-150px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-200px) scale(0.7); }
    }
    .sparkle {
      position: fixed; pointer-events: none; font-size: 24px;
      animation: sparkleOut 1s ease-out forwards; z-index: 99;
    }
    @keyframes sparkleOut {
      0%   { opacity: 1; transform: scale(0.3) rotate(0deg); }
      60%  { opacity: 1; transform: scale(1.6) rotate(30deg); }
      100% { opacity: 0; transform: scale(0.1) rotate(60deg); }
    }
    .reaction {
      position: fixed; color: #fff; font-size: 24px; pointer-events: none;
      animation: reactionUp 1.3s ease-out forwards; z-index: 101;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    @keyframes reactionUp {
      0%   { opacity: 0; transform: translateY(0) scale(0.4); }
      20%  { opacity: 1; transform: translateY(-14px) scale(1.2); }
      70%  { opacity: 1; transform: translateY(-55px) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(0.8); }
    }
  </style>
</head>

    };
    const foods = ["🍕","🍰","🎂","🍩","🍦","🍣","🌮","🍔","🍭","🍪","🍫","🥗","🍜","🧁","🍓","🥞","🍿","🌯","🍤","🥐","🍛","🧇","🫐","🍉","🥩"];
    const reactions = ["😋","🤤","😍","🥰","😆","🤩","🫶","💖","🥳","😝"];
    let count = 0, isEating = false;
    const eyesEl  = document.getElementById("jenny-eyes");
    const mouthEl = document.getElementById("jenny-mouth");
    function setEyes(key)  { eyesEl.src  = ASSETS[key]; }
    function setMouth(key) { mouthEl.src = ASSETS[key]; }
    function feedJenny() {
      if (isEating) return;
      isEating = true;
      count++;
      document.getElementById("counter").textContent = count + (count === 1 ? " bite so far!" : " bites so far! 🎉");
      const food = foods[Math.floor(Math.random() * foods.length)];
      const reaction = reactions[Math.floor(Math.random() * reactions.length)];
      const btn = document.getElementById("feedBtn");
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      spawnEl("food-float", food, cx - 22, rect.top - 10);
      spawnEl("reaction", reaction, cx + 30, rect.top - 30);
      ["✨","⭐","🌟","💫"].forEach((s, i) => {
        setTimeout(() => spawnEl("sparkle", s, rect.left + Math.random() * rect.width, rect.top - 10 - Math.random() * 60), i * 110);
      });
      setEyes("eyes_up"); setMouth("mouth_happy");
      setTimeout(() => setEyes("eyes_left"),   220);
      setTimeout(() => setEyes("eyes_right"),  440);
      setTimeout(() => setEyes("eyes_normal"), 680);
      setTimeout(() => { setMouth("mouth_neutral"); isEating = false; }, 1100);
    }
    function spawnEl(cls, text, x, y) {
      const el = document.createElement("div");
      el.className = cls; el.textContent = text;
      el.style.left = x + "px"; el.style.top = y + "px";
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }
    function blink() {
      if (!isEating) {
        setEyes("eyes_closed");
        setTimeout(() => { if (!isEating) setEyes("eyes_normal"); }, 130);
      }
      setTimeout(blink, 2400 + Math.random() * 2600);
    }
    setTimeout(blink, 2000);
  </script>
