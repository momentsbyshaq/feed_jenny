<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Feed Jenny! 🎂</title>
  <!--
  ============================================================
  GITHUB FOLDER STRUCTURE — upload all files in the same folder
  ============================================================

  feed-jenny/               ← your repo root
  ├── index.html            ← this file (rename feed_jenny_template.html → index.html)
  ├── assets/
  │   ├── jenny_body.png        ← full character, transparent bg, exported from Figma
  │   ├── jenny_eyes_normal.png ← just the eyes, looking forward
  │   ├── jenny_eyes_up.png     ← eyes looking up (for when food appears)
  │   ├── jenny_eyes_left.png   ← eyes darting left
  │   ├── jenny_eyes_right.png  ← eyes darting right
  │   ├── jenny_eyes_closed.png ← eyes closed (for blinking)
  │   ├── jenny_mouth_neutral.png ← normal mouth/expression
  │   └── jenny_mouth_happy.png   ← big smile

  HOW TO EXPORT FROM FIGMA:
  1. Select each layer/group
  2. Bottom-right panel → Export → PNG → check "transparent background"
  3. Export at 2x for sharp mobile screens
  4. Name them exactly as above

  HOW TO UPLOAD TO GITHUB:
  1. Go to your repo on github.com
  2. Click "Add file" → "Upload files"
  3. Drag ALL files in at once (index.html + assets/ folder)
  4. Click "Commit changes"
  5. Go to Settings → Pages → Source: main → Save
  6. Your site: https://YOURUSERNAME.github.io/feed-jenny
  ============================================================
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at top, #c0185a 0%, #8b0f3e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      padding: 44px 20px 60px;
    }

    .title {
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 24px;
      line-height: 1.3;
    }

    /* ── Character container ── */
    .jenny-container {
      position: relative;
      width: 300px;   /* ← adjust to match your asset width */
    }

    /* ── Body layer (bottom) ── */
    .jenny-body {
      width: 100%;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* ── Eyes layer (sits on top of body) ── */
    .jenny-eyes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.05s;
    }

    /* ── Mouth layer (sits on top of body) ── */
    .jenny-mouth {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.08s;
    }

    /* ── FEED button ── */
    .feed-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      /*
        ↓ ADJUST THIS — move button to sit over the FEED badge on her shirt
      */
      top: 52%;
      z-index: 3;
      background: #f4b8c8;
      color: #8b0f3e;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: none;
      border-radius: 50px;
      padding: 13px 48px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      white-space: nowrap;
      transition: transform 0.1s, background 0.1s;
    }
    .feed-btn:active {
      transform: translateX(-50%) scale(0.93);
      background: #f0a0b8;
    }

    .counter {
      color: rgba(255,255,255,0.8);
      font-size: 15px;
      font-weight: 500;
      margin-top: 16px;
      letter-spacing: 0.06em;
    }

    /* ── Floating food emoji ── */
    .food-float {
      position: fixed;
      font-size: 44px;
      pointer-events: none;
      animation: floatUp 1.5s ease-out forwards;
      z-index: 100;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(0.8); }
      20%  { opacity: 1; transform: translateY(-20px) scale(1.25); }
      80%  { opacity: 1; transform: translateY(-150px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-200px) scale(0.7); }
    }

    .sparkle {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      animation: sparkleOut 1s ease-out forwards;
      z-index: 99;
    }
    @keyframes sparkleOut {
      0%   { opacity: 1; transform: scale(0.3) rotate(0deg); }
      60%  { opacity: 1; transform: scale(1.6) rotate(30deg); }
      100% { opacity: 0; transform: scale(0.1) rotate(60deg); }
    }

    .reaction {
      position: fixed;
      color: #fff;
      font-size: 24px;
      pointer-events: none;
      animation: reactionUp 1.3s ease-out forwards;
      z-index: 101;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    @keyframes reactionUp {
      0%   { opacity: 0; transform: translateY(0) scale(0.4); }
      20%  { opacity: 1; transform: translateY(-14px) scale(1.2); }
      70%  { opacity: 1; transform: translateY(-55px) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(0.8); }
    }
  </style>
</head>
<body>

  <div class="title">To wish Jenny a<br>Happy Birthday,<br>tap to feed!</div>

  <div class="jenny-container">

    <!-- LAYER 1: Body (full character, eyes/mouth can be blank or neutral here) -->
    <img
      class="jenny-body"
      src="assets/jenny_body.png"
      alt="Jenny"
    />
    <!-- ↑ REPLACE: export your full character from Figma as jenny_body.png
         Tip: you can leave the eyes/mouth drawn on the body image —
         then position the eye/mouth layers directly on top to cover them -->

    <!-- LAYER 2: Eyes (swapped out during animations) -->
    <img
      class="jenny-eyes"
      id="jenny-eyes"
      src="assets/jenny_eyes_normal.png"
      alt=""
    />
    <!-- ↑ REPLACE: export just the eye area from Figma as jenny_eyes_normal.png
         Make sure it has a transparent background so body shows around it -->

    <!-- LAYER 3: Mouth (swapped between neutral and happy) -->
    <img
      class="jenny-mouth"
      id="jenny-mouth"
      src="assets/jenny_mouth_neutral.png"
      alt=""
    />
    <!-- ↑ REPLACE: export just the mouth from Figma as jenny_mouth_neutral.png -->

    <!-- FEED button — sits over her shirt badge -->
    <button class="feed-btn" id="feedBtn" onclick="feedJenny()">FEED 🎂</button>

  </div>

  <div class="counter" id="counter">0 bites so far!</div>

  <script>
    // ── Asset paths — update these if you rename your files ──
    const ASSETS = {
      eyes_normal:  'assets/jenny_eyes_normal.png',
      eyes_up:      'assets/jenny_eyes_up.png',
      eyes_left:    'assets/jenny_eyes_left.png',
      eyes_right:   'assets/jenny_eyes_right.png',
      eyes_closed:  'assets/jenny_eyes_closed.png',
      mouth_neutral:'assets/jenny_mouth_neutral.png',
      mouth_happy:  'assets/jenny_mouth_happy.png',
    };

    // Preload all images so swaps are instant
    Object.values(ASSETS).forEach(src => { new Image().src = src; });

    // ── Food & reactions ──
    const foods = [
      '🍕','🍰','🎂','🍩','🍦','🍣','🌮','🍔','🍭','🍪',
      '🍫','🥗','🍜','🧁','🍓','🥞','🍿','🌯','🍤','🥐',
      '🍛','🧇','🫐','🍉','🥩','🍱','🥟','🍡','🧆','🥘'
    ];
    const reactions = ['😋','🤤','😍','🥰','😆','🤩','🫶','💖','🥳','😝'];

    let count = 0;
    let isEating = false;
    const eyesEl  = document.getElementById('jenny-eyes');
    const mouthEl = document.getElementById('jenny-mouth');

    function setEyes(key)  { eyesEl.src  = ASSETS[key]; }
    function setMouth(key) { mouthEl.src = ASSETS[key]; }

    // ── Main feed function ──
    function feedJenny() {
      if (isEating) return;
      isEating = true;
      count++;
      document.getElementById('counter').textContent =
        count + (count === 1 ? ' bite so far!' : ' bites so far! 🎉');

      const food     = foods[Math.floor(Math.random() * foods.length)];
      const reaction = reactions[Math.floor(Math.random() * reactions.length)];
      const btn  = document.getElementById('feedBtn');
      const rect = btn.getBoundingClientRect();
      const cx   = rect.left + rect.width / 2;

      // Floating food emoji
      spawnEl('food-float', food, cx - 22, rect.top - 10);

      // Reaction emoji
      spawnEl('reaction', reaction, cx + 28 + Math.random() * 24, rect.top - 30);

      // Sparkles
      ['✨','⭐','🌟','💫'].forEach((s, i) => {
        setTimeout(() => {
          spawnEl('sparkle', s,
            rect.left - 10 + Math.random() * (rect.width + 40),
            rect.top - 10 - Math.random() * 60
          );
        }, i * 110);
      });

      animateEating();
    }

    // ── Eye/mouth animation sequence ──
    function animateEating() {
      setEyes('eyes_up');        // look up at food
      setMouth('mouth_happy');   // big smile

      setTimeout(() => setEyes('eyes_left'),   220);
      setTimeout(() => setEyes('eyes_right'),  440);
      setTimeout(() => setEyes('eyes_normal'), 680);

      setTimeout(() => {
        setMouth('mouth_neutral');
        isEating = false;
      }, 1100);
    }

    // ── Idle blink every ~3s ──
    function blink() {
      if (!isEating) {
        setEyes('eyes_closed');
        setTimeout(() => { if (!isEating) setEyes('eyes_normal'); }, 120);
      }
      setTimeout(blink, 2400 + Math.random() * 2600);
    }

    // ── Spawn a floating element ──
    function spawnEl(className, text, x, y) {
      const el = document.createElement('div');
      el.className = className;
      el.textContent = text;
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    // Start idle after 2s
    setTimeout(blink, 2000);
  </script>

</body>
</html>
